name: Model pipeline

# Unit tests -> small held-out A1/A2 evaluation on the runner's CPU (Ollama) -> validation
# and bias gates -> champion comparison -> on main only: push to Artifact Registry and
# deploy a new Cloud Run revision. Notifications on failure, failed gates and completion.
#
# Configure in the repository settings (nothing project-specific is stored here):
#   variables: GCP_PROJECT_ID, GCP_REGION, AR_DOCKER_REPO, AR_GENERIC_REPO,
#              CLOUD_RUN_SERVICE, RUN_SERVICE_ACCOUNT
#   secrets:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
#              ALERT_EMAIL_TO, ALERT_SMTP_USER, ALERT_SMTP_PASSWORD, SLACK_WEBHOOK_URL
# Without the GCP variables the release job is skipped; without the alert secrets,
# notifications are only logged.

on:
  push:
    branches:
      - main
      - "feature/**"
      - model-pipeline
    paths:
      - "ml/**"
      - ".github/workflows/model-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ml/**"
      - ".github/workflows/model-pipeline.yml"

permissions:
  contents: read
  id-token: write   # workload identity federation for GCP

env:
  OLLAMA_VERSION: "0.40.11"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -e ../shared -e ../data-pipeline -e .
      - name: Lint (ruff)
        run: ruff check src tests serving
      # No network, no model server, no keys
      - name: Unit tests
        run: python -m pytest -q --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ml-pytest-report
          path: ml/pytest-report.xml

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ml
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      promoted: ${{ steps.champion.outputs.promoted }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -e ../shared -e ../data-pipeline -e .
      - name: Pull the dish catalog (public DVC remote)
        working-directory: .
        run: |
          dvc pull data-pipeline/data/processed/dish_profiles.json.dvc \
            data-pipeline/data/processed/pantrypath.sqlite.dvc
      - name: Model id of the proposed setting
        id: model
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from pantrypath_ml.local_llm import get_candidate, load_candidates
          p = json.load(open("registry/proposed.json"))
          print("id=" + get_candidate(load_candidates(), p["candidate"], server="ollama",
                                      quantization=p["quantization"]).model)
          EOF
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ steps.model.outputs.id }}
      - name: Start Ollama on the runner's CPU
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull "${{ steps.model.outputs.id }}"
      # The proposed setting on a small slice of the A1 and A2 TEST sets, then the gates
      - name: Held-out evaluation and gates
        id: gate
        run: |
          set +e
          python -m pantrypath_ml.select final --ci --server ollama --no-mlflow | tee "$RUNNER_TEMP/final.json"
          status=${PIPESTATUS[0]}
          echo "passed=$([ "$status" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "final=$(ls -d reports/final/*-ci | tail -n 1)" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Fetch the current champion from Artifact Registry
        if: vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main'
      - name: Pull champion record
        if: vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AR_DOCKER_REPO: ${{ vars.AR_DOCKER_REPO }}
          AR_GENERIC_REPO: ${{ vars.AR_GENERIC_REPO }}
        run: python -m pantrypath_ml.registry pull-champion
      - name: Compare with the champion
        id: champion
        run: |
          python -m pantrypath_ml.select promote --final "${{ steps.gate.outputs.final }}/final.json" \
            | tee "$RUNNER_TEMP/promote.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print('promoted=' + str(d['promoted']).lower())" \
            "$RUNNER_TEMP/promote.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: model-evaluation
          path: |
            ml/reports/final/
            ml/registry/champion*.json

  release:
    needs: evaluate
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.evaluate.outputs.promoted == 'true' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_DOCKER_REPO: ${{ vars.AR_DOCKER_REPO }}
      AR_GENERIC_REPO: ${{ vars.AR_GENERIC_REPO }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      RUN_SERVICE_ACCOUNT: ${{ vars.RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -e ../shared -e ../data-pipeline -e .
      - uses: actions/download-artifact@v7
        with:
          name: model-evaluation
          path: ml
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push the model-server image
        id: image
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          echo "uri=$(python -m pantrypath_ml.registry push-image --tag "$GITHUB_SHA" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Push the champion record
        run: python -m pantrypath_ml.registry push-champion
      - name: Deploy a new Cloud Run revision (the previous one stays for rollback)
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: bash serving/deploy.sh

  notify:
    needs: [test, evaluate, release]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -e ../shared -e ../data-pipeline -e .
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: model-evaluation
          path: ml
      - name: Send the notification
        env:
          TEST: ${{ needs.test.result }}
          EVAL: ${{ needs.evaluate.result }}
          PASSED: ${{ needs.evaluate.outputs.passed }}
          RELEASE: ${{ needs.release.result }}
          PROMOTED: ${{ needs.evaluate.outputs.promoted }}
        run: |
          body="$(ls -d reports/final/*-ci 2>/dev/null | tail -n 1)/final.md"
          if [ "$EVAL" = "failure" ] && [ "$PASSED" = "false" ]; then
            event=gate_failed; subject="model gates failed on ${GITHUB_REF_NAME}"
          elif [ "$TEST" = "failure" ] || [ "$EVAL" = "failure" ] || [ "$RELEASE" = "failure" ]; then
            event=failure; subject="model pipeline failed on ${GITHUB_REF_NAME}"
          else
            event=completed; subject="model pipeline completed on ${GITHUB_REF_NAME} (promoted: ${PROMOTED:-false})"
          fi
          python -m pantrypath_ml.notify --event "$event" --subject "$subject" \
            --body "tests=$TEST evaluation=$EVAL release=$RELEASE
          $RUN_URL" --body-file "$body"
