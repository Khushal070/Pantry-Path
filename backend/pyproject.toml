[project]
name = "pantrypath-backend"
version = "0.1.0"
description = "Pantry Path chat API: profiles and chats as JSON files, searches in memory"
requires-python = ">=3.11"
# Dependencies are pinned in requirements*.txt (demo, live, dev)
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pantrypath_core", "pantrypath_pipeline", "pantrypath_ml"]
