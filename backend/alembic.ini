# Alembic: database migrations for accounts and profiles (backend/migrations/).
# From backend/, with PANTRYPATH_DB_OWNER_URL set (repo-root .env, see .env.example):
#
#   alembic upgrade head        # bring the database up to date
#   alembic current             # which migration it is at
#   alembic downgrade base      # undo everything (deletes all accounts and profiles)
#
# The database URL is never written here: migrations/env.py reads it from the environment.

[alembic]
script_location = %(here)s/migrations
path_separator = os
# so migrations/env.py can import app.settings
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
