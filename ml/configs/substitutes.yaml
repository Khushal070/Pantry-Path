# A3 substitution table: for an ingredient with no safe product, the substitutes code may
# suggest, in order of preference. Written by hand from general cooking knowledge, by
# food family (dairy, egg, wheat and gluten, meat, fish and shellfish, nuts, peanuts,
# sesame, soy), not from any evaluation set's dishes. Teammates: review and extend.
#
# Every candidate lists what it may contain (`contains`, required, [] for nothing):
# allergens (milk, egg, fish, shellfish, tree_nuts, peanuts, wheat, soy, sesame, gluten)
# and diet conflicts (meat: not vegetarian; animal: an animal product, not vegan). Fish
# and shellfish are not vegetarian; milk and egg are not vegan. Where common products
# vary (vegan butter is often soy- or nut-based), the list is the cautious one. Audited
# against the Open Food Facts snapshot (python -m pantrypath_ml.audit_substitutes); the
# Nov 2026 audit added soy to seitan, wheat and gluten to tamari, milk and meat to mushroom
# sauce, peanuts and soy to sunflower seeds, tree nuts to coconut creamer (often an almond
# blend), soy to rice noodles (instant kits) and gluten to crushed rice cereal (barley malt).
#
# An ingredient matches the key that ends its name ("cheddar cheese" -> cheese, "chicken
# broth" -> broth; plurals count), the longest first; a key inside the name doesn't
# count ("tortilla chips" is not a tortilla). A candidate is used only if its contains
# list and its name (the substitute screen in answer.yaml) both pass the shopper's avoid
# list and diet; the first that passes wins, and a candidate equal to the ingredient is
# skipped. No candidate passes: no substitute is suggested. These are suggestions, not
# checked products: the answer always says so.

